services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dop_preproduction
      POSTGRES_USER: dop_local
      POSTGRES_PASSWORD: local_only_change_me
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dop_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dop_local -d dop_preproduction"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dop_postgres_data:
